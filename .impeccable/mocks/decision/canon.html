<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<style>
  :root { --bg:#ffffff; --ink:#111827; --dim:#6b7280; --blue:#2563eb; --green:#16a34a; --line:#e5e7eb; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:390px; height:844px; overflow:hidden; background:#f9fafb; color:var(--ink); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; background:var(--bg); border-bottom:1px solid var(--line); }
  .top b { font-size:20px; }
  .pill { display:inline-flex; gap:6px; align-items:center; background:#ecfdf5; color:var(--green); padding:6px 12px; border-radius:999px; font-size:14px; font-weight:600; }
  .pill i { width:8px; height:8px; border-radius:50%; background:var(--green); }
  .tile { margin:16px; height:330px; border-radius:20px; background:#111827; color:#fff; display:grid; place-items:center; text-align:center; }
  .tile b { font-size:22px; }
  .tile p { color:#9ca3af; margin-top:6px; font-size:15px; }
  .tile span { display:inline-block; margin-top:16px; background:var(--blue); padding:13px 22px; border-radius:999px; font-weight:600; }
  .files { margin:0 16px; background:var(--bg); border-radius:16px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .fh { display:flex; justify-content:space-between; align-items:center; }
  .fh b { font-size:18px; }
  .fh span { background:var(--blue); color:#fff; padding:9px 16px; border-radius:999px; font-weight:600; font-size:14px; }
  .row { padding:14px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border:0; }
  .row b { font-size:15px; }
  .row p { color:var(--dim); font-size:13px; margin-top:3px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:8px; }
  .bar i { display:block; width:62%; height:100%; background:var(--blue); border-radius:3px; }
</style>
</head>
<body>
<div class="top"><b>Dline</b><span class="pill"><i></i>Direct, 7 ms</span></div>
<section class="tile"><div><b>You're connected</b><p>Call and send files at the same time.</p><span>Start video call</span></div></section>
<section class="files">
  <div class="fh"><b>Files</b><span>Send files</span></div>
  <div class="row"><b>sunset-varkala.jpg</b><p>2.6 of 4.2 MB, 3.1 MB/s</p><div class="bar"><i></i></div></div>
  <div class="row"><b>amma-birthday.mp4</b><p>Received 182 MB in 14 s, verified</p></div>
</section>
</body>
</html>
