<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f6f6f3; --ink:#121518; --dim:#5f656b; --alert:#ffb000; --go:#1f8f5f; --rule:#d9d9d3; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:390px; height:844px; overflow:hidden; background:#e9e9e4; color:var(--ink); font-family:'Archivo',sans-serif; }
  .top { display:flex; justify-content:space-between; padding:20px; font-weight:800; font-size:22px; font-variation-settings:'wdth' 115; }
  .top span { font-size:15px; font-weight:600; color:var(--dim); }
  .pass { margin:0 16px; background:var(--paper); border-radius:14px; display:grid; grid-template-columns:1fr 92px; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.07); }
  .main { padding:16px; border-right:2px dashed var(--rule); }
  .route { display:flex; justify-content:space-between; align-items:end; }
  .route b { display:block; font-size:30px; font-weight:800; font-variation-settings:'wdth' 80; letter-spacing:-0.01em; }
  .route small { color:var(--dim); font-size:13px; }
  .arrow { flex:1; height:2px; background:var(--ink); margin:0 10px 14px; }
  .segs { display:grid; grid-template-columns:repeat(3,1fr); margin-top:14px; border-top:1px solid var(--rule); padding-top:10px; }
  .segs small { display:block; color:var(--dim); font-size:12px; }
  .segs b { font-family:'JetBrains Mono',monospace; font-size:15px; }
  .segs .ok { color:var(--go); }
  .stub { display:grid; place-items:center; }
  .qr { width:64px; height:64px; background:
    conic-gradient(var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0) 0 0/16px 16px; border:6px solid var(--paper); outline:3px solid var(--ink); }
  .call { margin:14px 16px 0; height:200px; border-radius:14px; background:var(--ink); color:#fff; display:grid; place-items:center; text-align:center; }
  .call b { font-size:22px; }
  .call span { display:inline-block; margin-top:12px; background:#fff; color:var(--ink); padding:12px 18px; border-radius:8px; font-weight:800; }
  .board { margin:14px 16px 0; background:var(--paper); border-radius:14px; padding:14px 16px; }
  .bh { display:flex; justify-content:space-between; align-items:center; }
  .bh b { font-size:20px; font-weight:800; }
  .bh span { border:2px solid var(--ink); border-radius:8px; padding:6px 12px; font-weight:800; font-size:14px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  th { text-align:left; color:var(--dim); font-weight:600; font-size:12px; padding:6px 0; border-bottom:1px solid var(--rule); }
  td { padding:10px 0; border-bottom:1px solid var(--rule); font-family:'JetBrains Mono',monospace; font-size:13px; }
  td:first-child { font-family:'Archivo',sans-serif; font-weight:700; font-size:14px; }
  tr.live td { background:color-mix(in srgb, var(--alert) 22%, transparent); }
  .st { font-weight:700; }
  .st.ok { color:var(--go); }
</style>
</head>
<body>
<div class="top">Dline <span>Leave</span></div>
<section class="pass">
  <div class="main">
    <div class="route"><div><small>From</small><b>You</b></div><div class="arrow"></div><div style="text-align:right"><small>To</small><b>Them</b></div></div>
    <div class="segs"><div><small>Code</small><b>GTU-TFN</b></div><div><small>Path</small><b class="ok">Direct</b></div><div><small>Ping</small><b>7 ms</b></div></div>
  </div>
  <div class="stub"><div class="qr"></div></div>
</section>
<section class="call"><div><b>You're connected</b><br><span>Start video call</span></div></section>
<section class="board">
  <div class="bh"><b>Files</b><span>Send files</span></div>
  <table>
    <tr><th>File</th><th>Size</th><th>Status</th></tr>
    <tr class="live"><td>sunset-varkala.jpg</td><td>4.2 MB</td><td class="st">62%, 1 s</td></tr>
    <tr><td>amma-birthday.mp4</td><td>182 MB</td><td class="st ok">Verified</td></tr>
    <tr><td>tickets.pdf</td><td>310 KB</td><td class="st ok">Verified</td></tr>
  </table>
</section>
</body>
</html>
