<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Dline</title>
  <desc id="desc">Two stations, You and Them, joined by a direct purple metro line carrying files and a video call.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25255a"/>
      <stop offset="1" stop-color="#101026"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.74" r="0.55">
      <stop offset="0" stop-color="#a55bd0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a55bd0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: Overpass, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .packet { animation: east 3.6s linear infinite; }
    .packet.two { animation-delay: -1.2s; }
    .packet.three { animation-delay: -2.4s; }
    .packet.west { animation-name: west; animation-duration: 4.4s; }
    @keyframes east {
      0% { transform: translateX(0); opacity: 0; }
      8%, 92% { opacity: 1; }
      100% { transform: translateX(736px); opacity: 0; }
    }
    @keyframes west {
      0% { transform: translateX(0); opacity: 0; }
      8%, 92% { opacity: 1; }
      100% { transform: translateX(-736px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .packet { animation: none; opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
    <rect width="1280" height="6" fill="#a55bd0"/>
  </g>

  <text x="640" y="84" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="5" fill="#b3b3cc">PEER-TO-PEER  ·  NO MEDIA SERVER  ·  NO ACCOUNT</text>
  <text x="640" y="182" text-anchor="middle" font-size="112" font-weight="800" letter-spacing="-2" fill="#ffffff">Dline</text>
  <text x="640" y="228" text-anchor="middle" font-size="24" fill="#d8d8ec">Video calls and full-quality file sharing, device to device.</text>

  <!-- Path plate: direct, nothing relayed -->
  <rect x="510" y="258" width="260" height="32" rx="16" fill="#35d495" fill-opacity="0.14" stroke="#35d495" stroke-opacity="0.7"/>
  <circle cx="536" cy="274" r="5" fill="#35d495"/>
  <text x="652" y="279.5" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#35d495">DIRECT  ·  0 B RELAYED</text>

  <!-- The line, with a tick for each lane -->
  <line x1="272" y1="330" x2="1008" y2="330" stroke="#a55bd0" stroke-width="14" stroke-linecap="round"/>
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="370" y="318" width="4" height="24" rx="2"/>
    <rect x="450" y="318" width="4" height="24" rx="2"/>
    <rect x="530" y="318" width="4" height="24" rx="2"/>
    <rect x="610" y="318" width="4" height="24" rx="2"/>
    <rect x="666" y="318" width="4" height="24" rx="2"/>
    <rect x="746" y="318" width="4" height="24" rx="2"/>
    <rect x="826" y="318" width="4" height="24" rx="2"/>
    <rect x="906" y="318" width="4" height="24" rx="2"/>
  </g>

  <!-- Moving traffic: files east, the call both ways -->
  <g>
    <rect class="packet" x="266" y="324" width="16" height="12" rx="3" fill="#35d495"/>
    <rect class="packet two" x="266" y="324" width="16" height="12" rx="3" fill="#35d495"/>
    <rect class="packet three" x="266" y="324" width="16" height="12" rx="3" fill="#35d495"/>
    <circle class="packet west" cx="1008" cy="330" r="6" fill="#ffb21f"/>
  </g>

  <!-- Stations -->
  <circle cx="272" cy="330" r="24" fill="#ffffff" stroke="#a55bd0" stroke-width="10"/>
  <circle cx="1008" cy="330" r="24" fill="#ffffff" stroke="#a55bd0" stroke-width="10"/>
  <text x="272" y="392" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="4" fill="#ffffff">YOU</text>
  <text x="1008" y="392" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="4" fill="#ffffff">THEM</text>
</svg>
